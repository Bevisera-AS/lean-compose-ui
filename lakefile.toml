name = "compose-ui"
version = "0.1.0"
defaultTargets = ["Compose"]

[[require]]
name = "sdl"
git = "https://github.com/philnguyen/lean-sdl3"
rev = "e5dc25504402b87fbc9368ac366922fd8e66974c"

[[lean_lib]]
name = "Compose"

[[lean_exe]]
name = "gallery"
root = "Main"

# Registers the `ComposeTests.*` submodules (Harness + per-area test groups)
# so the test exe below can import them; a bare `lean_exe` does not glob its
# srcDir. (Named `ComposeTests` because the pinned sdl package already exports
# `Tests.*` modules, and Lake module names are workspace-global.)
[[lean_lib]]
name = "ComposeTests"
srcDir = "test"
globs = ["ComposeTests.*"]

[[lean_exe]]
name = "test"
srcDir = "test"
root = "ComposeTests"
